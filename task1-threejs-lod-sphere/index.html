<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课程球面 LOD 知识图谱</title>
  </head>
  <body>
    <main id="app">
      <section id="scene"></section>
      <aside id="panel">
        <div class="brand">
          <strong>课程球面 LOD</strong>
          <span id="lodLabel">LOD 0</span>
        </div>
        <div id="courseTabs" class="tabs"></div>
        <div class="row">
          <button id="overviewBtn" type="button">总览</button>
          <button id="editBtn" type="button">微调</button>
        </div>
        <div class="meta">
          <p id="courseTitle">四个教材</p>
          <p id="selectionText">未选择节点</p>
        </div>
        <div id="editor" class="editor hidden">
          <label>
            phi
            <input id="phiInput" type="range" min="-3.1416" max="3.1416" step="0.01" value="0" />
          </label>
          <label>
            psi
            <input id="psiInput" type="range" min="-1.2" max="1.2" step="0.01" value="0" />
          </label>
          <div class="pad">
            <button data-nudge="up" type="button">上</button>
            <button data-nudge="left" type="button">左</button>
            <button data-nudge="right" type="button">右</button>
            <button data-nudge="down" type="button">下</button>
          </div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
