<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>球面知识地图编辑器</title>
  </head>
  <body>
    <main id="app">
      <section id="scene"></section>
      <aside id="libraryPanel" class="floating-panel">
        <div class="brand">
          <div>
            <strong>球面知识地图编辑器</strong>
            <small>配置驱动 · Schema v4</small>
          </div>
          <span id="dirtyBadge" class="status-badge">已保存</span>
        </div>
        <div class="toolbar toolbar-grid">
          <button id="importBtn" type="button">导入</button>
          <button id="exportBtn" type="button">导出</button>
          <button id="undoBtn" type="button" title="撤销（Ctrl+Z）">撤销</button>
          <button id="redoBtn" type="button" title="重做（Ctrl+Shift+Z）">重做</button>
        </div>
        <input id="fileInput" type="file" accept="application/json,.json" hidden />
        <div class="section-heading">
          <span>内容结构</span>
          <button id="addCourseBtn" class="compact-button" type="button">＋课程</button>
        </div>
        <div id="outline" class="outline" aria-label="课程内容结构"></div>
        <p id="configSummary" class="panel-note"></p>
      </aside>
      <aside id="panel">
        <div class="brand">
          <strong>课程球面 LOD</strong>
          <span id="lodLabel">LOD 0</span>
        </div>
        <div id="courseTabs" class="tabs"></div>
        <div class="row">
          <button id="overviewBtn" type="button">总览</button>
          <button id="editBtn" type="button">微调</button>
          <button id="addVertexBtn" type="button">新建顶点</button>
        </div>
        <div class="meta">
          <p id="courseTitle">课程总览</p>
          <p id="selectionText">未选择节点</p>
        </div>
        <div id="selectionActions" class="selection-actions"></div>
        <section id="inspector" class="inspector">
          <p class="empty-state">从左侧结构树或球面选择一个对象。</p>
        </section>
        <div id="editor" class="editor hidden">
          <label>
            phi
            <input id="phiInput" type="range" min="-3.1416" max="3.1416" step="0.01" value="0" />
          </label>
          <label>
            psi
            <input id="psiInput" type="range" min="-1.5708" max="1.5708" step="0.01" value="0" />
          </label>
          <div class="pad">
            <button data-nudge="up" type="button" aria-label="向上微调" title="向上微调">&uarr;</button>
            <button data-nudge="left" type="button" aria-label="向左微调" title="向左微调">&larr;</button>
            <button data-nudge="right" type="button" aria-label="向右微调" title="向右微调">&rarr;</button>
            <button data-nudge="down" type="button" aria-label="向下微调" title="向下微调">&darr;</button>
          </div>
        </div>
      </aside>
      <section id="placementBar" class="placement-bar hidden" aria-live="polite">
        <div>
          <strong id="placementTitle">放置模式</strong>
          <span id="placementHint">点击球面放置点</span>
        </div>
        <label id="draftNameField" class="draft-name hidden">
          名称
          <input id="draftNameInput" type="text" />
        </label>
        <div class="row">
          <button id="finishPlacementBtn" type="button">完成</button>
          <button id="cancelPlacementBtn" type="button">取消</button>
        </div>
      </section>
      <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
